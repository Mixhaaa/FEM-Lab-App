<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FEM Lab: resuelve problemas de ingeniería lineales con el Método de Elementos Finitos usando elementos lineales. Universidad Distrital, Diseño por Elementos Finitos 2026-1." />
    <meta name="theme-color" content="#161311" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preload" href="./fonts/material-symbols.woff2" as="font" type="font/woff2" crossorigin />
    <title>FEM Lab</title>
    <script>
      // Aplica el tema guardado antes de pintar (evita un destello)
      try {
        var t = (JSON.parse(localStorage.getItem('femlab:v1') || '{}').state || {}).tema || 'sistema';
        var claro = t === 'claro' || (t === 'sistema' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = claro ? 'light' : 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>FEM Lab necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
